# Set DB_HOST=aec-db and DB_ENABLED=true in .env.
# docker compose -f compose.yaml -f compose.postgresql.yaml up -d
services:
  aec-gateway:
    networks:
      - aec-db
  aec-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - aec-db-data:/var/lib/postgresql/data
    networks:
      - aec-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  aec-db:
    internal: true
volumes:
  aec-db-data:
