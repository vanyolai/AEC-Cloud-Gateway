[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aec-cloud-gateway"
version = "0.4.1"
description = "Unofficial read-only Python client for AEC Cloud inverter telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
gateway = ["paho-mqtt>=2.1,<3", "tzdata>=2025.2", "psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "build>=1,<2", "paho-mqtt>=2.1,<3", "tzdata>=2025.2", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
